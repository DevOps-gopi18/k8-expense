apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: expense
  # labels of deployment resources
  labels:
    app: frontend
    tier: web
    project: expense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      tier: web
      project: expense
  template:
    metadata:
      labels:
        app: frontend
        tier: web
        project: expense
    spec:
      containers:
      - name: nginx
        image: joindevops/frontend:1.2.0
        ports:
        - containerPort: 8080
---
apiVersion: v1 
kind: Service
metadata:
  name: frontend
  namespace: expense
spec:
  selector: # labels are used as selectors
    app: frontend
    tier: web
    project: expense
  ports:
  - protocol: TCP
    port: 80 #service port
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 8080}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:688567292254:certificate/0e43071e-96f4-4cf3-a2ae-ac8d09e430ca
    alb.ingress.kubernetes.io/group.name: gopi310
spec:
  ingressClassName: alb
  rules:
  - host: "frontend.gopisg18.online"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: frontend
            port:
              number: 80
        